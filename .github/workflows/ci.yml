name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run test:all
      - run: npm run docs:html
      - run: git diff --exit-code -- docs/aiui-contest-rhythm-jump.html docs/index.html
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: rhythm-jump-aix
          path: output/rhythm-jump.aix
          retention-days: 14

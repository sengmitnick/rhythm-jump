<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>cover</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 810px; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #fbfaf6;
  }
  .canvas { position: relative; width: 1440px; height: 810px; overflow: hidden; }

  .blob { position: absolute; }
  .blob.mint {
    left: -230px; top: -280px; width: 680px; height: 470px;
    background: #d9efe4; border-radius: 46% 54% 58% 42% / 52% 46% 54% 48%;
  }
  .blob.mint2 {
    left: 330px; top: -150px; width: 330px; height: 330px;
    background: #f2f8f4; border-radius: 52% 48% 42% 58% / 48% 52% 48% 52%;
  }
  .blob.blue {
    right: -240px; bottom: -320px; width: 860px; height: 740px;
    background: #dbe7fa; border-radius: 50% 50% 44% 56% / 46% 54% 46% 54%;
  }

  .dots {
    position: absolute; color: #efad94; opacity: .75;
    background-image: radial-gradient(circle, currentColor 2px, transparent 2.4px);
    background-size: 24px 24px;
    right: 96px; bottom: 64px; width: 132px; height: 88px;
  }

  .ring {
    position: absolute; border: 3px solid #cfe8db; border-radius: 50%;
    left: 70px; bottom: 62px; width: 96px; height: 96px;
  }
  .ring.small { left: 186px; bottom: 132px; width: 44px; height: 44px; }

  .content { position: absolute; left: 96px; top: 196px; width: 700px; }

  .eyebrow {
    display: inline-block; padding: 10px 20px; border: 1.5px solid #c9ded3;
    border-radius: 999px; background: rgba(255, 255, 255, .7);
    color: #2f6b52; font-size: 20px; letter-spacing: 3px;
  }

  h1 {
    margin-top: 34px; font-size: 106px; font-weight: 800; line-height: 1.04;
    letter-spacing: -1px; color: #0d2440;
  }

  .sub {
    margin-top: 28px; font-size: 40px; font-weight: 600; line-height: 1.45;
    color: #23486f; letter-spacing: .5px;
  }

  .rule { width: 78px; height: 6px; border-radius: 3px; background: #4fae86; margin: 34px 0 20px; }

  .meta { font-size: 21px; color: #5c7288; letter-spacing: 1.5px; }

  .visual { position: absolute; right: 88px; top: 116px; width: 588px; }

  .panel-frame {
    border: 10px solid #ffffff; border-radius: 24px; overflow: hidden;
    box-shadow: 0 36px 72px rgba(16, 38, 66, .22);
    transform: rotate(-2deg);
  }
  .panel-frame img { display: block; width: 100%; }

  .caption {
    margin-top: 34px; text-align: right; font-size: 20px; color: #35566f;
    letter-spacing: 1px;
  }
  .caption b { color: #2f6b52; font-weight: 600; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="blob mint"></div>
    <div class="blob mint2"></div>
    <div class="blob blue"></div>
    <div class="dots"></div>
    <div class="ring"></div>
    <div class="ring small"></div>

    <div class="content">
      <div class="eyebrow">灵珠工作流 × AIUI</div>
      <h1>灵珠当后端</h1>
      <p class="sub">给 AIUI 应用做一张<br>跨账号排行榜</p>
      <div class="rule"></div>
      <div class="meta">数据表 · 工作流 · 流式回包 · 双账号验收</div>
    </div>

    <div class="visual">
      <div class="panel-frame">
        <img src="../docs/images/cover-panel.png" alt="">
      </div>
      <div class="caption">开始 → 校验 → 查询 → 汇总　·　<b>12 个节点</b></div>
    </div>
  </div>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用灵珠做后端、用 IMU 做输入：AIUI 体感游戏「节奏开跳」</title>
<meta name="description" content="节奏开跳开源实践：灵珠工作流共享排行榜后端 +  Rokid AI 眼镜头部 IMU 体感判定">
<style>
:root{
  --bg:#ffffff;--fg:#12151a;--muted:#5b6472;--line:#e3e7ee;--accent:#0f9d58;
  --accent-soft:#e7f6ee;--code-bg:#f6f8fa;--code-fg:#1f2430;--card:#fbfcfd;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0b0d10;--fg:#e8edf4;--muted:#9aa5b5;--line:#232a33;--accent:#4ade80;
  --accent-soft:#12261a;--code-bg:#11151a;--code-fg:#dbe3ee;--card:#121619;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{max-width:1180px;margin:0 auto;padding:32px 20px 80px;display:grid;gap:40px;
  grid-template-columns:minmax(0,1fr)}
@media (min-width:1040px){.layout{grid-template-columns:240px minmax(0,1fr);align-items:start}}
.toc{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto;
  border-left:2px solid var(--line);padding:0 0 0 16px;font-size:13px;line-height:1.6}
@media (max-width:1039px){.toc{position:static;max-height:none;border-left:0;border-top:1px solid var(--line);padding:16px 0 0}}
.toc strong{display:block;margin-bottom:8px;color:var(--muted);letter-spacing:.06em;font-size:11px;text-transform:uppercase}
.toc a{display:block;padding:3px 0;color:var(--muted)}
.toc a:hover{color:var(--accent)}
.toc a.lv3{padding-left:12px;font-size:12px}
article{max-width:820px}
h1{font-size:30px;line-height:1.35;margin:0 0 8px;letter-spacing:-.01em}
h2{font-size:22px;margin:44px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);scroll-margin-top:20px}
h3{font-size:17px;margin:28px 0 8px;scroll-margin-top:20px}
p{margin:12px 0}
ul,ol{margin:12px 0;padding-left:22px}
li{margin:6px 0}
hr{border:0;border-top:1px solid var(--line);margin:36px 0}
blockquote{margin:20px 0;padding:14px 18px;background:var(--accent-soft);
  border-left:3px solid var(--accent);border-radius:0 8px 8px 0}
blockquote p{margin:4px 0;font-size:14px;color:var(--muted)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;
  background:var(--code-bg);color:var(--code-fg);padding:2px 6px;border-radius:5px}
pre{margin:16px 0;padding:16px 18px;background:var(--code-bg);border:1px solid var(--line);
  border-radius:10px;overflow:auto}
pre code{background:none;padding:0;font-size:13px;line-height:1.65;white-space:pre}
.table-wrap{overflow-x:auto;margin:16px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
th{background:var(--card);font-weight:600;white-space:nowrap}
img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block;margin:14px 0}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted);background:var(--card)}
.pill.accent{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);
  color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:16px}
@media print{
  .toc,.top,footer{display:none}
  body{background:#fff;color:#000}
  pre,blockquote{border:1px solid #ddd}
  a{color:#000;text-decoration:underline}
  h2{page-break-after:avoid}
}
</style>
</head>
<body>
<div class="layout">
  <nav class="toc" aria-label="目录">
    <strong>目录</strong>
    <!--TOC-->
  </nav>
  <article>
    <div class="top">
      <span class="pill accent">AIUI 征文</span>
      <span class="pill">Rokid AI 眼镜</span>
      <a class="pill" href="https://github.com/sengmitnick/rhythm-jump">源码仓库</a>
      <a class="pill" href="https://github.com/sengmitnick/rokid-lingzhu-backend">灵珠后端技能</a>
    </div>
    <!--BODY-->
    <footer>
      <span>原创代码 MIT，第三方音频与谱面按各自 CC 许可</span>
      <a href="https://github.com/sengmitnick/rhythm-jump">github.com/sengmitnick/rhythm-jump</a>
    </footer>
  </article>
</div>
</body>
</html>
